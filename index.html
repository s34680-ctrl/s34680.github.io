<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pimchanok Portfolio</title>

    <!-- เชื่อมกับ CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER / แถบด้านบน
    ========================== -->
    <header class="navbar">

        <!-- ✏️ แก้ชื่อเว็บไซต์ตรงนี้ -->
        <a href="index.html" class="logo">
            Pimchanok Portfolio
        </a>

        <nav>
            <!-- ปุ่มหน้าแรก -->
            <a href="index.html" class="nav-btn active">
                หน้าแรก
            </a>

            <!-- ปุ่มข้อมูลส่วนตัว -->
            <a href="portfolio.html" class="nav-btn">
                ข้อมูลส่วนตัว
            </a>
        <a href="activities.html" class="nav-btn">
            กิจกรรม
        </a>
        </nav>

    </header>


    <!-- =========================
         หน้าแรก
         มีเฉพาะส่วนนี้
    ========================== -->
    <main class="home">

        <div class="home-content">

            <div class="home-text">

                <p class="mini-title">
                    MY PORTFOLIO
                </p>

                <!-- ✏️ แก้ชื่อของตัวเองตรงนี้ -->
                <h1>
                    Hello, I'm<br>
                    <span>Pimchanok</span>
                </h1>

                <!-- ✏️ แก้ข้อความแนะนำตัวสั้น ๆ ตรงนี้ -->
                <p class="home-description">
                    ยินดีต้อนรับเข้าสู่ Portfolio ของฉัน
                    เว็บไซต์ที่รวบรวมตัวตน ความสามารถ
                    ประสบการณ์ และเรื่องราวต่าง ๆ
                </p>

                <!-- ปุ่มไปหน้า Portfolio -->
                <a href="portfolio.html" class="main-button">
                    รู้จักฉัน
                    <span>→</span>
                </a>

            </div>


            <!-- =========================
                 รูปโปรไฟล์วงกลม
            ========================== -->
            <div class="profile-area">

                <div class="profile-circle">

                    <!-- ✏️ เปลี่ยนชื่อรูปตรงนี้ถ้ารูปชื่ออื่น -->
                    <img src="images/profile.jpeg"
                         alt="Pimchanok">

                </div>

                <!-- ตกแต่งวงกลมเล็ก ๆ -->
                <div class="floating-dot dot-one"></div>
                <div class="floating-dot dot-two"></div>
                <div class="floating-dot dot-three"></div>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="home-footer">
        <p>
            © 2026 Pimchanok Portfolio
        </p>
    </footer>


</body>
</html>
